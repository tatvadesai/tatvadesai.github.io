---
layout: default
title: writings
permalink: /essays/
---

<h1 class="page-title">writings</h1>

<ul class="plain-list writing-list home-writing">
    {%- assign essays = site.essays | sort: "date" | reverse %}
    {%- for essay in essays %}
    <li>
        <a href="{{ essay.url | relative_url }}">{{ essay.title }}</a>
        <time datetime="{{ essay.date | date_to_xmlschema }}">{{ essay.date | date: "%b %Y" | downcase }}</time>
    </li>
    {%- endfor %}
</ul>
