---
layout: default
title: essays
permalink: /essays/
---

<h1 class="page-title">essays</h1>

<div class="essays-list">
    {% for essay in site.essays reversed %}
    <div class="essay-item">
        <a href="{{ essay.url }}" class="essay-link">
            <h3>{{ essay.title }}</h3>
            <span class="essay-date">{{ essay.date | date: "%B %d, %Y" }}</span>
        </a>
    </div>
    {% endfor %}
</div>
